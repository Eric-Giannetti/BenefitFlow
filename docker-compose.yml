services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: benefitflow
      POSTGRES_USER: benefitflow
      POSTGRES_PASSWORD: benefitflow-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benefitflow -d benefitflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - benefitflow

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - benefitflow

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: benefitflow
      RABBITMQ_DEFAULT_PASS: benefitflow-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - benefitflow

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - benefitflow

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - benefitflow

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./deploy/otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
      - loki
    networks:
      - benefitflow

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - otel-collector
    networks:
      - benefitflow

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: benefitflow-dev
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger
      - loki
    networks:
      - benefitflow

  benefitflow-api:
    build:
      context: .
      dockerfile: src/BenefitFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=benefitflow;Username=benefitflow;Password=benefitflow-dev
      ConnectionStrings__Redis: redis:6379
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__ManagementEndpoint: http://rabbitmq:15672
      RabbitMQ__Username: benefitflow
      RabbitMQ__Password: benefitflow-dev
      OpenTelemetry__Endpoint: http://otel-collector:4317
      Database__ApplyMigrations: "true"
      Database__SeedDemoData: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 30s
    networks:
      - benefitflow

  benefitflow-worker:
    build:
      context: .
      dockerfile: src/BenefitFlow.Worker/Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=benefitflow;Username=benefitflow;Password=benefitflow-dev
      ConnectionStrings__Redis: redis:6379
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__ManagementEndpoint: http://rabbitmq:15672
      RabbitMQ__Username: benefitflow
      RabbitMQ__Password: benefitflow-dev
      OpenTelemetry__Endpoint: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      benefitflow-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - benefitflow

networks:
  benefitflow:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  loki-data:
  prometheus-data:
  grafana-data:
